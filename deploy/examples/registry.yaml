# Zot over plain HTTP, without persistence, for a test cluster, with the access rules of the
# Zeabur Catalog's Zot: pushes, deletes and source reads need a token that the controller signs
# with the key in the Secret zot-token-signer (scripts/deploy-example.sh creates it), and anyone
# may pull images.
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot
  namespace: builder-registry
data:
  config.json: |
    {
      "distSpecVersion": "1.1.1",
      "storage": {"rootDirectory": "/var/lib/registry"},
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": {"bearer": {
          "realm": "http://registry.builder-registry.svc.cluster.local:5000/zot/auth/token",
          "service": "zot",
          "cert": "/etc/zot/token/tls.crt"
        }},
        "accessControl": {"repositories": {
          "**": {"anonymousPolicy": ["read"]},
          "**/source": {"policies": []}
        }}
      },
      "log": {"level": "info"}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: builder-registry
  labels: {app.kubernetes.io/name: registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: registry}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:v2.1.22
          args: [serve, /etc/zot/config.json]
          ports: [{containerPort: 5000, name: http}]
          readinessProbe:
            tcpSocket: {port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/zot/config.json, subPath: config.json, readOnly: true}
            - {name: token, mountPath: /etc/zot/token, readOnly: true}
            - {name: data, mountPath: /var/lib/registry}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
      volumes:
        - name: config
          configMap: {name: zot}
        - name: token
          secret: {secretName: zot-token-signer, items: [{key: tls.crt, path: tls.crt}]}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: builder-registry
spec:
  selector: {app.kubernetes.io/name: registry}
  ports: [{port: 5000, targetPort: http, name: http}]
