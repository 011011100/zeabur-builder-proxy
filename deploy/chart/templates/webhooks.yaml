{{- if .Values.webhooks.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: zeabur-builder-webhooks
  labels: {{- include "builder.labels" . | nindent 4 }}
spec:
  selector: {{- include "builder.selector" . | nindent 4 }}
  ports:
    - {name: http, port: 80, targetPort: webhooks}
{{- if .Values.webhooks.ingress.enabled }}
{{- $ingress := .Values.webhooks.ingress }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeabur-builder-webhooks
  labels: {{- include "builder.labels" . | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $ingress.tlsSecretName }}
  tls:
    - hosts: [{{ required "webhooks.ingress.host is required with TLS" $ingress.host | quote }}]
      secretName: {{ $ingress.tlsSecretName }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: {{ include "builder.webhookPath" . }}/
            pathType: Prefix
            backend:
              service:
                name: zeabur-builder-webhooks
                port: {name: http}
      {{- with $ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
{{- if .Values.webhooks.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zeabur-builder-webhooks
  labels: {{- include "builder.labels" . | nindent 4 }}
spec:
  parentRefs: {{- required "webhooks.httpRoute.parentRefs is required" .Values.webhooks.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.webhooks.httpRoute.hostnames }}
  hostnames: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path: {type: PathPrefix, value: {{ include "builder.webhookPath" . }}/}
      backendRefs:
        - {name: zeabur-builder-webhooks, port: 80}
{{- end }}
{{- end }}
