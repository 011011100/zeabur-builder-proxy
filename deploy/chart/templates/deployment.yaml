apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeabur-builder
  labels: {{- include "builder.labels" . | nindent 4 }}
spec:
  # Only the holder of the Lease `zeabur-builder` reconciles. Another replica waits for it.
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {{- include "builder.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "builder.selector" . | nindent 8 }}
    spec:
      serviceAccountName: zeabur-builder
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ include "builder.image" (list .Values.image .Chart) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - controller
            - --github-app-secret={{ .Values.githubApp.secretName }}
            - --github-app-grants={{ .Values.githubApp.grantsName }}
            {{- if .Values.webhooks.enabled }}
            - --webhook-addr=0.0.0.0:{{ .Values.webhooks.port }}
            - --webhook-path={{ include "builder.webhookPath" . }}
            - --webhook-max-body={{ .Values.webhooks.maxBodyBytes | int }}
            - --webhook-rate={{ .Values.webhooks.rate | int }}
            - --webhook-burst={{ .Values.webhooks.burst | int }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: ZEABUR_BUILDER_DEFAULT_REGISTRY
              value: {{ required "registry.host is required" .Values.registry.host | quote }}
            - name: ZEABUR_BUILDER_JOB_IMAGE
              value: {{ include "builder.image" (list .Values.jobImage .Chart) | quote }}
            {{- with .Values.registry.authPrefix }}
            - {name: ZEABUR_BUILDER_REGISTRY_AUTH_PREFIX, value: {{ . | quote }}}
            {{- end }}
            {{- with include "builder.registryCA" . }}
            - name: ZEABUR_BUILDER_REGISTRY_CA
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.registry.tokenKey }}
            {{- if and .namespace .secret }}
            - name: ZEABUR_BUILDER_REGISTRY_TOKEN_KEY
              value: {{ printf "%s/%s" .namespace .secret | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.registry.http }}
            - {name: ZEABUR_BUILDER_REGISTRY_HTTP, value: "true"}
            {{- end }}
            {{- if .Values.webhooks.enabled }}
          ports:
            - {name: webhooks, containerPort: {{ .Values.webhooks.port }}}
          readinessProbe:
            httpGet: {path: /healthz, port: webhooks}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources: {{- toYaml .Values.resources | nindent 12 }}
