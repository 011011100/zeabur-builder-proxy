# Zot over plain HTTP for the proof of concept, without persistence. scripts/poc.sh writes its
# config and htpasswd: every build namespace has a user named after it that may push only below
# `<namespace>/`, and anyone may pull. Not for production: see docs/poc.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: builder-registry
  labels: {app.kubernetes.io/name: registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: registry}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot:v2.1.22
          args: [serve, /etc/zot/config.json]
          ports: [{containerPort: 5000, name: http}]
          readinessProbe:
            tcpSocket: {port: http}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/zot/config.json, subPath: config.json, readOnly: true}
            # A Secret volume, not subPath: Zot reloads accounts when the file changes.
            - {name: htpasswd, mountPath: /etc/zot/auth, readOnly: true}
            - {name: data, mountPath: /var/lib/registry}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
      volumes:
        - name: config
          configMap: {name: zot}
        - name: htpasswd
          secret: {secretName: zot-htpasswd}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: builder-registry
spec:
  selector: {app.kubernetes.io/name: registry}
  ports: [{port: 5000, targetPort: http, name: http}]
