# A plain-HTTP registry for the proof of concept, without authentication or persistence. buildkitd
# is told it is insecure in buildkitd.yaml. Not for production: see docs/poc.md.
apiVersion: v1
kind: Namespace
metadata:
  name: builder-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: builder-registry
  labels: {app.kubernetes.io/name: registry}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: registry}
  template:
    metadata:
      labels: {app.kubernetes.io/name: registry}
    spec:
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          ports: [{containerPort: 5000, name: http}]
          env:
            - {name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true"}
          readinessProbe:
            httpGet: {path: /v2/, port: http}
          volumeMounts: [{name: data, mountPath: /var/lib/registry}]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: builder-registry
spec:
  selector: {app.kubernetes.io/name: registry}
  ports: [{port: 5000, targetPort: http, name: http}]
