name: MingXing proxy build

on:
  push:
    branches: [mingxing-proxy]
  workflow_dispatch:
    inputs:
      import_only:
        description: 'Diagnose the K3s watcher using an existing bundle without recompiling'
        type: boolean
        default: false
      artifact_run:
        description: 'Existing run that produced the bundle to diagnose'
        type: string
        default: '41011147150'
      proxy_only:
        description: 'Rerun proxy fixtures only when production code matches the verified baseline'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mingxing-proxy-${{ github.ref }}-${{ inputs.import_only && 'import' || 'build' }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !inputs.import_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Commit formatting from the pinned toolchain
        id: source
        run: |
          nix develop --command cargo fmt --all
          if ! git diff --quiet; then
            if git diff --name-only | grep -vE '\.rs$'; then
              echo 'Formatting changed a non-Rust file; refusing to commit it.' >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add --update -- '*.rs'
            git commit -s -m 'style: apply the pinned Rust formatter'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify-and-package:
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      RUSTFLAGS: -Zthreads=2
      NEXTEST_TEST_THREADS: 2
      ZEABUR_PROXY_SMOKE_ONLY: ${{ inputs.proxy_only && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.format.outputs.commit }}
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Locate the pinned compiler
        run: dirname "$(nix develop --command bash -c 'command -v rustc')" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mingxing-proxy-v1
          cache-on-failure: true
      - name: Check, test, build and package
        run: nix develop --command bash scripts/proxy-ci.sh
      - name: Keep the verified installation bundle and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeabur-builder-proxy-linux-amd64
          path: |
            target/proxy-artifacts/*.tar.gz
            target/proxy-artifacts/*.sha256
            target/proxy-artifacts/format.patch
            target/proxy-artifacts/cluster/
          if-no-files-found: warn
          retention-days: 14
  import-diagnostic:
    if: ${{ inputs.import_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      ARTIFACT_RUN: ${{ inputs.artifact_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Reuse the existing checksummed bundle
        run: |
          [[ "$ARTIFACT_RUN" =~ ^[0-9]+$ ]]
          gh run download "$ARTIFACT_RUN" --repo "$GITHUB_REPOSITORY" \
            --name zeabur-builder-proxy-linux-amd64 --dir target/proxy-artifacts
          cd target/proxy-artifacts
          sha256sum -c ./*.tar.gz.sha256
          tar -xzf ./*.tar.gz
      - name: Diagnose the real K3s watcher
        run: nix develop --command bash scripts/diagnose-proxy-import.sh
      - name: Keep import evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proxy-import-diagnostics
          path: target/proxy-artifacts/cluster/offline-import/
          if-no-files-found: warn
