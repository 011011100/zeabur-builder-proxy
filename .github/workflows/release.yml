name: Release

# A tag v* builds the three images, smokes them on k3s, publishes them and the chart by digest,
# signs and attests them, then leaves a draft release that a maintainer checks and publishes; this
# workflow never publishes it. Run by hand, it rehearses: CI, the builds and their smoke tests,
# nothing published. With verify_only it checks an existing draft again with this commit's scripts.
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rehearse or verify, as in Cargo.toml (v0.0.2); a rehearsal never publishes'
        required: true
      verify_only:
        description: 'Verify the existing draft release of this version; build and publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole of CI on this commit, the cluster job included.
  checks:
    if: ${{ !inputs.verify_only }}
    uses: ./.github/workflows/ci.yml

  prepare:
    runs-on: ubuntu-26.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verify_only && format('refs/tags/{0}', inputs.version) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - id: version
        name: The version is the workspace's and the chart's, with a changelog section, on main
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          plain="${VERSION#v}"
          crate=$(nix develop -c cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "zeabur-builder") | .version')
          chart=$(nix develop -c yq '.version + " " + .appVersion' deploy/chart/Chart.yaml)
          test "$crate" = "$plain"
          test "$chart" = "$plain $plain"
          grep -q "^## \[$plain\]" CHANGELOG.md
          if [[ "$GITHUB_EVENT_NAME" == push || "$VERIFY_ONLY" == true ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: build (linux-${{ matrix.arch }})
    needs: [prepare, checks]
    if: ${{ !inputs.verify_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Build the images
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: nix develop -c ./scripts/release-build.sh "$VERSION" "$ARCH" dist
      - name: Smoke the images as built, with the chart, on k3s
        env:
          ZEABUR_CI_IMAGE_TAG: release-${{ matrix.arch }}
        run: ./scripts/ci.sh kubernetes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: [prepare, build]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write # the images and the chart on ghcr.io
      id-token: write # keyless signatures and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: candidates
      - id: publish
        name: Publish the images and the chart by digest and sign them
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: nix develop -c ./scripts/release-publish.sh "$VERSION" candidates published
      - name: Attest the provenance of the controller image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.builder-image }}
          subject-digest: ${{ steps.publish.outputs.builder-digest }}
      - name: Attest the provenance of the Job image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.builder-job-image }}
          subject-digest: ${{ steps.publish.outputs.builder-job-digest }}
      - name: Attest the provenance of the Railpack planner image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.builder-railpack-image }}
          subject-digest: ${{ steps.publish.outputs.builder-railpack-digest }}
      - name: Attest the provenance of the chart
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.chart }}
          subject-digest: ${{ steps.publish.outputs.chart-digest }}
      - name: Attest the provenance of the release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: published/assets/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published
          path: published/
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push'
    needs: [prepare, publish]
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write # the draft
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published
          path: published
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          gh release create "$VERSION" published/assets/* --repo "$GITHUB_REPOSITORY"
          --verify-tag --target "$GITHUB_SHA" --draft --prerelease --title "Zeabur Builder $VERSION"
          --notes-file published/notes.md

  verify:
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          (needs.release.result == 'success' || inputs.verify_only) }}
    needs: [prepare, release]
    runs-on: ubuntu-26.04-arm
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      # The tag's checkout gives the Nix shell the release was built with.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.verify_only && format('refs/tags/{0}', inputs.version) || github.ref }}
          persist-credentials: false
      # verify_only: the scripts of the commit this run was started from, which may fix the check.
      - if: inputs.verify_only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: verification
          sparse-checkout: scripts
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - name: Download the draft's assets and verify them
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SCRIPTS: ${{ inputs.verify_only && 'verification/scripts' || 'scripts' }}
        run: |
          nix develop -c gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir downloaded
          nix develop -c "./$SCRIPTS/release-verify.sh" "$VERSION" downloaded \
            "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$VERSION"
